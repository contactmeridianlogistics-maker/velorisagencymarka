<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>VL Marketing Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C0C0C;--tx:#F0E6DB;--gold:#D8B56D;--wine:#A01D32;--wine2:#5E0F1B;--ln:rgba(240,230,219,.55);color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth;scroll-padding-top:20px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--tx);font-family:Kanit,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hg{background:linear-gradient(180deg,#6A5446 0%,#EBDCC0 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.big{font-weight:900;text-transform:uppercase;line-height:1;letter-spacing:-.01em;text-align:center;font-size:clamp(3rem,12vw,160px)}
.bar{position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,var(--wine),var(--gold));transform-origin:left;transform:scaleX(0);z-index:60}
.fi{opacity:0;transform:translate(var(--x,0),var(--y,30px));transition:opacity .7s cubic-bezier(.25,.1,.25,1) var(--d,0s),transform .7s cubic-bezier(.25,.1,.25,1) var(--d,0s)}
.fi.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.fi{opacity:1;transform:none;transition:none}}
.cbtn{display:inline-block;border-radius:999px;color:#fff;font-weight:500;text-transform:uppercase;letter-spacing:.14em;font-size:clamp(.75rem,1.2vw,1rem);padding:clamp(12px,1.4vw,16px) clamp(32px,4vw,48px);border:0;cursor:pointer;font-family:inherit;background:linear-gradient(123deg,#1a0508 7%,#8e1b2d 37%,#5e0f1b 72%,#b08a3e 100%);box-shadow:0 4px 4px rgba(160,29,50,.25),4px 4px 12px #7a1224 inset;outline:2px solid #fff;outline-offset:-3px}
.cbtn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ghost{display:inline-block;border:2px solid var(--ln);border-radius:999px;text-transform:uppercase;letter-spacing:.14em;font-weight:500;font-size:clamp(.75rem,1.1vw,1rem);padding:12px 34px;color:var(--tx);background:transparent;cursor:pointer;font-family:inherit;transition:background .2s}
.ghost:hover{background:rgba(240,230,219,.1)}
/* hero */
.hero{position:relative;height:100vh;height:100svh;min-height:560px;display:flex;flex-direction:column;overflow-x:clip;background:radial-gradient(900px 520px at 50% 58%,rgba(122,18,36,.38),transparent 70%),var(--bg)}
.top{display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + clamp(20px,3vw,32px)) clamp(20px,4vw,40px) 0;text-transform:uppercase;font-weight:500;letter-spacing:.1em;font-size:clamp(.72rem,1.6vw,1.35rem);position:relative;z-index:20}
.top a{transition:opacity .2s;padding:6px 0}.top a:hover{opacity:.7}
.hero h1{margin-top:clamp(8px,2vw,24px);width:100%;overflow:hidden;white-space:nowrap;font-size:min(9.4vw,26vh);padding:0 2vw}
@media(max-width:700px){.hero h1{white-space:normal;font-size:min(16.5vw,15vh);line-height:1}}
.hbar{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;padding:0 clamp(20px,4vw,40px) calc(env(safe-area-inset-bottom,0px) + clamp(28px,3vw,40px));position:relative;z-index:20}
.hbar p{font-weight:300;text-transform:uppercase;letter-spacing:.04em;line-height:1.3;font-size:clamp(.72rem,1.4vw,1.4rem);max-width:clamp(150px,22vw,280px)}
.pt{position:absolute;left:50%;top:58%;translate:-50% -50%;z-index:10;width:clamp(230px,min(32vw,46vh),460px);perspective:1000px;touch-action:pan-y}
.c3{aspect-ratio:1;border-radius:clamp(20px,2.4vw,30px);overflow:hidden;position:relative;transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform;box-shadow:0 40px 90px rgba(122,18,36,.5),0 0 0 1px rgba(216,181,109,.55),0 0 60px rgba(216,181,109,.12)}
.c3 img{width:100%;height:100%;object-fit:cover}
.gl{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,236,190,.28),transparent 48%);mix-blend-mode:screen}
/* marquee */
.mq{padding:clamp(96px,11vw,170px) 0 40px;overflow:hidden;background:var(--bg)}
.row{display:flex;gap:12px;width:max-content;margin-bottom:12px;will-change:transform}
.tile{flex:none;width:clamp(240px,29vw,420px);aspect-ratio:420/270;border-radius:20px;object-fit:cover}
/* about */
.about{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(40px,5vw,64px);padding:80px clamp(20px,4vw,40px);text-align:center}
.about p{max-width:560px;font-weight:500;line-height:1.6;font-size:clamp(1rem,2vw,1.35rem);color:var(--tx)}
.dc{position:absolute;aspect-ratio:3/4;border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 0 1px rgba(216,181,109,.4);animation:fl 6s ease-in-out infinite}.dc img{width:100%;height:100%;object-fit:cover}
@keyframes fl{50%{translate:0 -12px}}
@media(prefers-reduced-motion:reduce){.dc{animation:none}}
/* services */
.svc{background:#F0E6DB;color:#0C0C0C;border-radius:clamp(40px,5vw,60px) clamp(40px,5vw,60px) 0 0;padding:clamp(80px,9vw,128px) clamp(20px,4vw,40px)}
.svc h2{font-weight:900;text-transform:uppercase;text-align:center;font-size:clamp(3rem,12vw,160px);line-height:1;margin-bottom:clamp(64px,8vw,112px)}
.sl{max-width:1024px;margin:0 auto}
.si{display:flex;gap:clamp(16px,4vw,48px);align-items:flex-start;padding:clamp(32px,4vw,48px) 0;border-top:1px solid rgba(12,12,12,.15)}
.si:last-child{border-bottom:1px solid rgba(12,12,12,.15)}
.sn{font-weight:900;line-height:1;font-size:clamp(3rem,10vw,140px);min-width:1.25em}
.sn::first-letter{color:#7A1224}
.si h3{font-weight:500;text-transform:uppercase;font-size:clamp(1rem,2.2vw,2.1rem);margin-bottom:10px}
.si p{font-weight:300;line-height:1.6;max-width:42rem;opacity:.7;font-size:clamp(.85rem,1.6vw,1.25rem)}
/* projects */
.prj{position:relative;z-index:10;background:var(--bg);margin-top:clamp(-56px,-4vw,-40px);border-radius:clamp(40px,5vw,60px) clamp(40px,5vw,60px) 0 0;padding:clamp(80px,9vw,128px) clamp(12px,3vw,40px) clamp(40px,6vw,80px)}
.prj>h2{margin-bottom:clamp(48px,6vw,96px)}
.pw{height:85vh;min-height:520px}
.pc{position:sticky;transform-origin:50% 0;will-change:transform;border:2px solid var(--ln);border-radius:clamp(32px,5vw,60px);background:var(--bg);padding:clamp(14px,2.4vw,32px);max-width:1280px;margin:0 auto;box-shadow:0 -20px 50px rgba(0,0,0,.6)}
.pt2{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-bottom:clamp(14px,2vw,24px)}
.pn{font-weight:900;line-height:1;font-size:clamp(2.6rem,7vw,100px)}
.pm{flex:1;min-width:140px}.pm small{display:block;text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;color:var(--gold)}
.pm b{display:block;font-weight:600;text-transform:uppercase;font-size:clamp(1rem,2.2vw,2rem);line-height:1.1}
.pg2{display:grid;grid-template-columns:.4fr .6fr;gap:clamp(8px,1.4vw,16px)}
.pg2 img{width:100%;object-fit:cover;border-radius:clamp(24px,4vw,60px)}
.pg2 .l{display:grid;gap:clamp(8px,1.4vw,16px)}
.i1{height:clamp(110px,15vw,220px)}.i2{height:clamp(130px,21vw,320px)}.i3{height:calc(clamp(110px,15vw,220px) + clamp(130px,21vw,320px) + clamp(8px,1.4vw,16px))}
/* contact */
.ct{padding:clamp(80px,10vw,140px) clamp(20px,4vw,40px) 40px;text-align:center;background:radial-gradient(800px 400px at 50% 100%,rgba(122,18,36,.35),transparent 70%),var(--bg)}
.ct p.l{max-width:560px;margin:24px auto 40px;font-weight:300;font-size:clamp(1rem,1.8vw,1.3rem);opacity:.85}
form{max-width:640px;margin:0 auto;display:grid;gap:14px;text-align:left}
label{font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;display:grid;gap:6px;color:var(--gold);font-weight:500}
input,textarea{font:inherit;font-weight:300;padding:14px 16px;border:1px solid rgba(240,230,219,.3);border-radius:14px;background:rgba(240,230,219,.04);color:var(--tx);font-size:1rem;letter-spacing:0;text-transform:none}
.ops{display:flex;flex-wrap:wrap;gap:8px}.ops label{flex-direction:row;align-items:center;gap:8px;letter-spacing:.02em;text-transform:none;color:var(--tx);font-weight:300;border:1px solid rgba(240,230,219,.3);border-radius:999px;padding:7px 14px;font-size:.9rem}
footer{margin-top:80px;padding-top:28px;border-top:1px solid rgba(240,230,219,.15);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-weight:300;font-size:.9rem;opacity:.8;text-align:left}

.vs{padding:clamp(40px,6vw,90px) clamp(16px,4vw,40px) clamp(56px,8vw,110px);background:var(--bg);text-align:center}
.vs h2{margin-bottom:clamp(24px,4vw,48px);font-size:clamp(2.2rem,7.5vw,104px)}
.vw{max-width:960px;margin:0 auto;border-radius:clamp(16px,2.4vw,30px);overflow:hidden;background:#000;aspect-ratio:16/9;box-shadow:0 40px 90px rgba(122,18,36,.5),0 0 0 1px rgba(216,181,109,.55),0 0 60px rgba(216,181,109,.12)}
.vw video{display:block;width:100%;height:100%;object-fit:cover}
.ml{margin:-16px auto 36px;font-size:clamp(1rem,1.6vw,1.15rem)}
.ml a,footer a{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(216,181,109,.4)}
.ml a:hover,footer a:hover{border-bottom-color:var(--gold)}
</style>
</head>

const a=ap.getBoundingClientRect(),p=cl((vh*.8-a.top)/(vh*.6+a.height),0,1),n=chs.length;
chs.forEach((c,i)=>{c.style.opacity=.2+.8*cl((p-i/n)*n,0,1)});
cards.forEach((c,i)=>{const w=c.parentElement.getBoundingClientRect(),stick=parseFloat(getComputedStyle(c).top),q=cl((stick-w.top)/(w.height*(cards.length-i)),0,1),t=1-(cards.length-1-i)*.03;c.style.transform=`scale(${1-(1-t)*q})`})}
addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});addEventListener('resize',upd);upd();
if(rm)chs.forEach(c=>c.style.opacity=1);
const c3=document.getElementById('c3');
addEventListener('pointermove',e=>{if(rm)return;const r=document.querySelector('.hero').getBoundingClientRect();if(r.bottom<0)return;const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;c3.style.transform=`rotateY(${x*22}deg) rotateX(${-y*18}deg)`;c3.style.setProperty('--gx',(50+x*70)+'%');c3.style.setProperty('--gy',(35+y*70)+'%')});
document.addEventListener('submit',e=>{if(e.target.id==='f'){e.preventDefault();document.getElementById('ok').textContent='Solicitud enviada. Te escribiremos pronto.';e.target.reset()}});
